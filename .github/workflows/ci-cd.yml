name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend Quality Checks (Typecheck, Lint & Tests)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Typecheck & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      # Safe build-time placeholders so Expo doesn't fail on missing env in CI
      EXPO_PUBLIC_SUPABASE_URL: "https://cfutaueuomfqkmqystkk.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "ci-build-anon-key"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Lint Check
        run: npm run lint

      - name: Jest Test Suite
        run: npm test

  # ---------------------------------------------------------------------------
  # 2. Supabase Database Migration Deployment
  # ---------------------------------------------------------------------------
  deploy-supabase:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/dev')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'cfutaueuomfqkmqystkk' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set in GitHub repository settings!"
            exit 1
          fi
          # Strip accidental quotes, whitespace or newlines from secrets
          CLEAN_PROJECT_REF=$(echo "$PROJECT_REF" | tr -d '[:space:]' | sed -e 's/^"//' -e 's/"$//')
          export SUPABASE_DB_PASSWORD=$(echo -n "$SUPABASE_DB_PASSWORD" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//' -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//")
          supabase link --project-ref "$CLEAN_PROJECT_REF"
          supabase db push
