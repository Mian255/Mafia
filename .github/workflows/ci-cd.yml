name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # 1. Frontend Quality Checks (Typecheck & Lint)
  # ---------------------------------------------------------------------------
  frontend-ci:
    name: Frontend CI (Typecheck & Lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Frontend
    env:
      # Safe build-time placeholders so Expo doesn't fail on missing env in CI
      EXPO_PUBLIC_SUPABASE_URL: "https://cfutaueuomfqkmqystkk.supabase.co"
      EXPO_PUBLIC_SUPABASE_ANON_KEY: "ci-build-anon-key"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: Frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript Typecheck
        run: npm run typecheck

      - name: Lint Check
        run: npm run lint

  # ---------------------------------------------------------------------------
  # 2. Supabase Database Migration Deployment
  # ---------------------------------------------------------------------------
  deploy-supabase:
    name: Deploy Supabase Migrations
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link and Push Migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF || 'cfutaueuomfqkmqystkk' }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN secret is not set in GitHub repository settings!"
            exit 1
          fi
          supabase link --project-ref "$PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --password "$SUPABASE_DB_PASSWORD"
